services:
  speech-api:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-adc.json
      USAGE_DB_PATH: /app/data/usage.sqlite3
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - speech-data:/app/data
      - type: bind
        source: ./secrets/google-adc.json
        target: /run/secrets/google-adc.json
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    pids_limit: 128
    mem_limit: 768m

volumes:
  speech-data:

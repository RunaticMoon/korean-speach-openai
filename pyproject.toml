[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-speech-openai"
version = "1.2.0"
description = "OpenAI-compatible Korean speech bridge for Paseo, Groq and Google Cloud TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "google-auth[requests]>=2.38,<3",
]

[project.scripts]
korean-speech-openai = "speech_proxy.cli:main"

[project.urls]
Repository = "https://github.com/RunaticMoon/korean-speach-openai"
Documentation = "https://github.com/RunaticMoon/korean-speach-openai#readme"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "openai>=1.70,<3"]

[tool.setuptools.packages.find]
include = ["speech_proxy*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

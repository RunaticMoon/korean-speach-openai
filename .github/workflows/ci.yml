name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test without cloud credentials
        run: python -m pytest
      - name: Build container
        run: docker build --tag korean-speech-openai:ci .
      - name: Check container startup without cloud credentials
        run: |
          docker run --detach --rm --name speech-api-ci \
            --read-only --tmpfs /tmp:size=128m,mode=1777 \
            --tmpfs /app/data:uid=10001,gid=10001 \
            --env PROXY_API_KEY=ci-only-not-a-real-secret-0000000000000000 \
            --publish 127.0.0.1:8787:8787 korean-speech-openai:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8787/health
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs speech-api-ci 2>/dev/null || true
          docker stop speech-api-ci 2>/dev/null || true
